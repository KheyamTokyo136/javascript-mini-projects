<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVOLVE — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="app-label">Revolve</div>
  <div class="card-header">
    <button class="icon-btn" id="clearBtn" title="Remove song">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="menuBtn" title="Add / change song">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <div class="art-wrap">
    <div class="art-ring">
      <div class="art" id="art">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </div>
    </div>
  </div>

  <div class="meta">
    <div class="meta-title" id="title">No song added</div>
    <div class="meta-artist" id="artist">Tap the menu icon to choose a track</div>
  </div>

  <div class="progress-row">
    <span class="dot-start"></span>
    <div class="seek-wrap">
      <div class="seek-track"></div>
      <div class="seek-fill" id="seekFill"></div>
      <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1">
    </div>
  </div>
  <div class="time-row">
    <span id="curTime">0:00</span>
    <span id="durTime">0:00</span>
  </div>

  <div class="transport">
    <button class="skip-btn" id="backBtn" title="Back 10s">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6V0L4 6l7 6V8c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H3c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
    </button>
    <button class="play-btn" id="playBtn" title="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="skip-btn" id="fwdBtn" title="Forward 10s">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6V0l7 6-7 6V8c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg>
    </button>
  </div>

  <input type="file" id="fileInput" accept="audio/*">
</div>

<script src="script.js"></script>
</body>
</html>
