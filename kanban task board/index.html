<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban Task Board</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Kanban Task Board</h1>

<div class="board">

    <!-- TODO -->

    <div class="column">

        <h2>Todo</h2>

        <button class="add-btn" data-column="todo">
            + Add Task
        </button>

        <div class="task-list" id="todo">

        </div>

    </div>



    <!-- IN PROGRESS -->

    <div class="column">

        <h2>In Progress</h2>

        <button class="add-btn" data-column="progress">
            + Add Task
        </button>

        <div class="task-list" id="progress">

        </div>

    </div>



    <!-- DONE -->

    <div class="column">

        <h2>Done</h2>

        <button class="add-btn" data-column="done">
            + Add Task
        </button>

        <div class="task-list" id="done">

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
