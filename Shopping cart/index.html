<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="sryle.css">
</head>
<body>

    <header class="navbar">
        <h1 class="logo"><i class="fa-solid fa-bag-shopping"></i> ShopEasy</h1>
        <button class="cart-toggle" id="cart-toggle">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cart-count">0</span>
        </button>
    </header>

    <main class="products-section">
        <h2>Products</h2>
        <div class="products-grid" id="products-grid">

            <div class="product-card" data-id="1" data-name="Wireless Headphones" data-price="59.99">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" alt="Headphones">
                <h3>Wireless Headphones</h3>
                <p class="price">$59.99</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-id="2" data-name="Smart Watch" data-price="89.99">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p class="price">$89.99</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-id="3" data-name="Running Shoes" data-price="45.50">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Running Shoes">
                <h3>Running Shoes</h3>
                <p class="price">$45.50</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-id="4" data-name="Backpack" data-price="34.99">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300" alt="Backpack">
                <h3>Backpack</h3>
                <p class="price">$34.99</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-id="5" data-name="Sunglasses" data-price="19.99">
                <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=300" alt="Sunglasses">
                <h3>Sunglasses</h3>
                <p class="price">$19.99</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

            <div class="product-card" data-id="6" data-name="Coffee Mug" data-price="12.00">
                <img src="https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=300" alt="Coffee Mug">
                <h3>Coffee Mug</h3>
                <p class="price">$12.00</p>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>

        </div>
    </main>

    <!-- Cart sidebar -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart-btn" id="close-cart-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="cart-items" id="cart-items">
            <p class="empty-cart-msg" id="empty-cart-msg">Your cart is empty.</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button class="checkout-btn">Checkout</button>
        </div>
    </aside>

<script src="script.js"></script>
</body>
</html>
